name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install numpy requests pyyaml pytest ruff
      - name: Lint
        run: ruff check src tests training scripts robot
      - name: Unit tests (hardware-independent core)
        run: pytest -v
