[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "door-inspection"
version = "1.0.0"
description = "Autonomous mobile-manipulator inspection of railway vehicle doors (YOLOE-26s + RealSense + LiDAR + UR5e)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Muhammad Yaseen" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "requests>=2.28"]

[project.optional-dependencies]
vision = ["ultralytics>=8.4", "opencv-python>=4.8", "pyyaml>=6.0"]
robot = ["ultralytics>=8.4", "opencv-python>=4.8", "pyrealsense2>=2.54", "flask>=2.3"]
dev = ["pytest>=7.4", "ruff>=0.5", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E221", "E241", "E272", "B905"]  # aligned constant tables are intentional

[tool.ruff.lint.per-file-ignores]
"robot/autonomous_mission.py" = ["E402", "I001"]
